services:
  - type: worker
    name: telegram-reminder-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: ./data/reminders.db
    disk:
      name: sqlite-data
      mountPath: /code/data
      sizeGB: 1
